services:
  # Always-on static file server for the built blog: docker compose up -d web
  web:
    image: nginx:alpine
    container_name: insightpulse-web
    ports:
      - "8080:80"
    volumes:
      - ./blog/site/public:/usr/share/nginx/html:ro
      - ./blog/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets nginx proxy /admin to the host
    restart: unless-stopped

  # One-shot site builder, invoked by `insightpulse accept/publish`:
  #   docker compose run --rm builder
  builder:
    image: hugomods/hugo:std
    working_dir: /src
    volumes:
      - ./blog/site:/src
    command: hugo --minify --cleanDestinationDir
    profiles: [build]
