[project]
name = "insightpulse"
version = "0.1.0"
description = "Semi-autonomous pipeline: crawl KOL papers/news from X and LinkedIn, agent-write blog drafts, review queue, self-hosted blog"
requires-python = ">=3.12"
dependencies = [
    "coding-agent-wrapper @ git+https://github.com/zzjas/caw.git",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-frontmatter>=1.1",
    # caw imports mcp.server.fastmcp, which was removed in mcp 2.0
    "mcp>=1.21.1,<2",
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.scripts]
insightpulse = "insightpulse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightpulse"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]
