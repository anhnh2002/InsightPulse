{% extends "base.html" %}
{% block title %}{{ post.name }} — InsightPulse Admin{% endblock %}
{% block content %}
<h1>Edit {{ post.name }}</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/admin/posts/{{ post.name }}/save">
  <h3>English (index.md)</h3>
  <textarea name="en">{{ post.en }}</textarea>
  <h3>Vietnamese (index.vi.md) <span class="muted">— leave empty to remove</span></h3>
  <textarea name="vi">{{ post.vi }}</textarea>
  <div class="row"><button class="primary" type="submit">Save</button></div>
</form>
{% endblock %}
