baseURL = "http://localhost:8080/"
title = "InsightPulse"
theme = "PaperMod"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[taxonomies]
tag = "tags"
topic = "topics"

[params]
description = "The big ideas from noteworthy AI papers — keep up without hours of reading"
images = ["images/og-default.png"]
defaultTheme = "auto"
displayFullLangName = true
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true

[[params.socialIcons]]
name = "github"
title = "InsightPulse on GitHub"
url = "https://github.com/anhnh2002/InsightPulse"

[[params.socialIcons]]
name = "cv"
title = "AnhNH"
url = "https://anhnh2002.github.io/"

[languages.en]
languageName = "English"
languageCode = "en-US"
weight = 1

[languages.en.params.homeInfoParams]
