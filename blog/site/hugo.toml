baseURL = "http://localhost:8080/"
title = "InsightPulse"
theme = "PaperMod"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[taxonomies]
tag = "tags"
topic = "topics"

[params]
description = "AI-assisted digests of papers and news shared by ML thought leaders"
images = ["images/og-default.png"]
defaultTheme = "auto"
displayFullLangName = true
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true

[[params.socialIcons]]
name = "github"
title = "InsightPulse on GitHub"
url = "https://github.com/anhnh2002/InsightPulse"

[[params.socialIcons]]
name = "cv"
title = "AnhNH"
url = "https://anhnh2002.github.io/"

[languages.en]
languageName = "English"
languageCode = "en-US"
weight = 1

[languages.en.params.homeInfoParams]
Title = "InsightPulse"
Content = "Curated, opinionated blog posts about papers and news surfaced from KOLs on X and LinkedIn"

[[languages.en.menus.main]]
name = "Posts"
url = "/posts/"
weight = 10

[[languages.en.menus.main]]
name = "Topics"
url = "/topics/"
weight = 20

[[languages.en.menus.main]]
name = "Tags"
url = "/tags/"
weight = 30

[[languages.en.menus.main]]
name = "Bookmarks"
url = "/bookmarks/"
weight = 40

[languages.vi]
languageName = "Tiếng Việt"
languageCode = "vi-VN"
weight = 2

[languages.vi.params.homeInfoParams]
Title = "InsightPulse"
Content = "Bài viết chọn lọc về các bài báo khoa học và tin tức AI từ các KOL trên X và LinkedIn"

[[languages.vi.menus.main]]
name = "Bài viết"
