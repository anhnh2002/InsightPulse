# Pipeline settings.
# Model names are raw provider strings (see `codex` account's available models),
# or the tiers FAST / STRONGEST (caw's built-in tier map may lag the account).
models:
  crawler: gpt-5.6-luna      # LinkedIn crawl agent (drives the scraper + extracts posts);
                             # bump to gpt-5.6-terra if its crawl judgment proves flaky
  triage: gpt-5.6-luna       # fast & cheap: paper/news/skip classification
  writer: gpt-5.6-sol        # frontier: blog writing

provider: codex          # caw provider (codex uses the Codex subscription via ~/.codex/auth.json)

limits:
  items_per_run: 10          # max items sent to the writer per run
  triage_batch_size: 20      # max posts per triage agent call
  paper_text_chars: 60000    # cap for paper.txt handed to the writer
  news_text_chars: 20000     # cap for fetched news page text

topics:
  max_depth: 3

# arxiv:                       # paper-name -> arXiv-id resolution thresholds
#   title_min_recall: 0.6      # min token-overlap recall to accept a title match
#   title_ambiguity_margin: 0.15  # refuse when top two candidates are this close

review:
  auto_accept: false         # true: publish drafts immediately without review
                             # (override per run with --auto-accept / --no-auto-accept)

# Blog settings (baseURL, title, languages) live in blog/site/hugo.toml.
